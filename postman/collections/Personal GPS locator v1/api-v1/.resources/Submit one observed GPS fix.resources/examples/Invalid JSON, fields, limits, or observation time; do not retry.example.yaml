$kind: http-example
name: Invalid JSON, fields, limits, or observation time; do not retry unchanged.
request:
  url: "{{baseUrl}}/api/v1/locations"
  method: POST
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "trackerId": "tracker-001",
        "latitude": 14.676,
        "longitude": 121.0437,
        "reportedAt": "2026-10-17T08:30:00Z",
        "accuracyMeters": 8,
        "batteryPercent": 82,
        "messageId": "fix-001",
        "source": "ESP32"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "Invalid location payload."
        }
      }
order: 3000
