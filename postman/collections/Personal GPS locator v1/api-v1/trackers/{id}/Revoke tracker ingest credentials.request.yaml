$kind: http-request
description: Revoke all active tokens without deleting this tracker.
url: '{{baseUrl}}/api/v1/trackers/:id/credentials'
method: DELETE
headers:
  Accept: application/json
  Cookie: '{{sessionCookieName}}={{ownerSessionCookie}}'
pathVariables:
  - key: id
    value: '{{trackerId}}'
    disabled: false
settings: {}
order: 3500
