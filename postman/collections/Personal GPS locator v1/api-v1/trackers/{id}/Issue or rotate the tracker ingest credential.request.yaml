$kind: http-request
description: Atomically revoke previous tokens; the new raw token is returned once.
url: "{{baseUrl}}/api/v1/trackers/:id/credentials"
method: POST
headers:
  Accept: application/json
  Cookie: '{{sessionCookieName}}={{ownerSessionCookie}}'
pathVariables:
  - key: id
    value: '{{trackerId}}'
    disabled: false
    description: (Required) Foreign-owner and nonexistent IDs both yield 404 for owner endpoints.
settings: {}
examples: ./.resources/Issue or rotate the tracker ingest credential.resources/examples
order: 3000
