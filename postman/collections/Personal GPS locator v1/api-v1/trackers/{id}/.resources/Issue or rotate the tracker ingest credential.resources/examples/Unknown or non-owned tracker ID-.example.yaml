$kind: http-example
name: Unknown or non-owned tracker ID.
request:
  url: "{{baseUrl}}/api/v1/trackers/:id/credentials"
  method: POST
  headers:
    - key: authjs.session-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: string
      disabled: false
      description: (Required) Foreign-owner and nonexistent IDs both yield 404 for owner endpoints.
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "NOT_FOUND",
          "message": "Tracker not found."
        }
      }
order: 3000
