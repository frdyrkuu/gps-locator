$kind: http-example
name: Missing or invalid credential; do not disclose whether an account or token exists.
request:
  url: "{{baseUrl}}/api/v1/trackers/:id"
  method: PATCH
  headers:
    - key: authjs.session-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: string
      disabled: false
      description: (Required) Foreign-owner and nonexistent IDs both yield 404 for owner endpoints.
  body:
    type: json
    content: |-
      {
        "name": "Motorcycle",
        "type": "ESP32",
        "reportingMode": "INTERVAL",
        "expectedIntervalSeconds": 30
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "UNAUTHORIZED",
          "message": "Authentication required."
        }
      }
order: 3000
