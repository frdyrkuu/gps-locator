$kind: http-example
name: Invalid JSON, fields, limits, or observation time; do not retry unchanged.
request:
  url: "{{baseUrl}}/api/v1/trackers/:id"
  method: PATCH
  headers:
    - key: authjs.session-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: string
      disabled: false
      description: (Required) Foreign-owner and nonexistent IDs both yield 404 for owner endpoints.
  body:
    type: json
    content: |-
      {
        "name": "Motorcycle",
        "type": "ESP32",
        "reportingMode": "INTERVAL",
        "expectedIntervalSeconds": 30
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "VALIDATION_ERROR",
          "message": "Invalid location payload."
        }
      }
order: 2000
