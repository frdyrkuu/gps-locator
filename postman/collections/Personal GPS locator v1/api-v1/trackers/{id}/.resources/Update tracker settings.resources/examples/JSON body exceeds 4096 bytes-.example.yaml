$kind: http-example
name: JSON body exceeds 4096 bytes.
request:
  url: "{{baseUrl}}/api/v1/trackers/:id"
  method: PATCH
  headers:
    - key: authjs.session-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: id
      value: string
      disabled: false
      description: (Required) Foreign-owner and nonexistent IDs both yield 404 for owner endpoints.
  body:
    type: json
    content: |-
      {
        "name": "Motorcycle",
        "type": "ESP32",
        "reportingMode": "INTERVAL",
        "expectedIntervalSeconds": 30
      }
response:
  statusCode: 413
  statusText: Request Entity Too Large
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "PAYLOAD_TOO_LARGE",
          "message": "Request body too large."
        }
      }
order: 5000
