$kind: http-example
name: Missing or invalid credential; do not disclose whether an account or token exists.
request:
  url: "{{baseUrl}}/api/v1/trackers"
  method: GET
  headers:
    - key: authjs.session-token
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "UNAUTHORIZED",
          "message": "Authentication required."
        }
      }
order: 2000
