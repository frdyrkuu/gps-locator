$kind: http-example
name: Owned trackers only; credentials are never included.
request:
  url: "{{baseUrl}}/api/v1/trackers"
  method: GET
  headers:
    - key: Cookie
      value: 'authjs.session-token=<session-cookie-value>'
    - key: Accept
      value: application/json
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Cache-Control: no-store
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "items": [
          {
            "id": "tracker-001",
            "name": "Motorcycle",
            "type": "ESP32",
            "reportingMode": "INTERVAL",
            "expectedIntervalSeconds": 30,
            "latestLocation": {
              "latitude": 14.676,
              "longitude": 121.0437,
              "reportedAt": "2026-10-17T08:30:00Z",
              "receivedAt": "2026-10-17T08:30:02Z",
              "source": "ESP32",
              "accuracyMeters": 8,
              "batteryPercent": 82
            }
          }
        ]
      }
order: 1000
